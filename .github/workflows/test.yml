name: Auditra CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt groq
        
    - name: Run Static Analysis (Ruff)
      run: |
        pip install ruff
        ruff check backend/ --ignore BLE001,RUF012,SIM102,PLW1510,SIM118,DTZ005,C401,F841,FURB162,SIM103
        
    - name: Run Core Test Suite
      run: |
        pip install pytest pytest-asyncio anyio
        python -m pytest -v tests/
        
    - name: Demonstrate Verification Gate (Demo Mode)
      run: |
        # In this demo repo, the targets are intentionally vulnerable.
        # This demonstrates that Auditra successfully catches the defects and exits with >0
        if python -m backend.auditra verify --json; then
          echo "Expected verification to fail on vulnerable targets, but it succeeded!"
          exit 1
        else
          echo "Verification successfully caught the vulnerable targets and exited non-zero."
          exit 0
        fi

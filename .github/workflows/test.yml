name: Auditra CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn groq pydantic
        
    - name: Run Static Analysis (Ruff)
      run: |
        pip install ruff
        ruff check backend/
        
    - name: Run Auditra Verification Gate
      run: |
        # Explicit exit code enforcement
        python -m backend.auditra verify --json

name: Auditra CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt groq
        
    - name: Run Static Analysis (Ruff)
      run: |
        pip install ruff
        ruff check backend/ --ignore BLE001,RUF012,SIM102,PLW1510,SIM118,DTZ005,C401,F841,FURB162,SIM103
        
    - name: Run Core Test Suite
      run: |
        pip install pytest pytest-asyncio anyio
        python -m pytest -v tests/
        
    - name: Test Verification Gate (Vulnerable Targets)
      run: |
        # Ensure targets are the vulnerable templates
        cp backend/target_templates/*.py backend/target_service/
        
        echo "Testing vulnerable targets - we expect verification to FAIL"
        if python -m backend.auditra verify --json; then
          echo "FAIL: Verification incorrectly passed vulnerable targets!"
          exit 1
        else
          echo "PASS: Verification successfully caught vulnerable targets."
          exit 0
        fi

    - name: Apply Secure Patches (Simulate Deployment)
      run: |
        python -c "
        from backend.auditra.verification_api import get_patch_code_fallback, TARGETS
        for node_id, path in TARGETS.items():
            with open(path, 'w', encoding='utf-8') as f:
                f.write(get_patch_code_fallback(node_id))
        "

    - name: Test Verification Gate (Secure Targets)
      run: |
        echo "Testing secure targets - we expect verification to PASS"
        python -m backend.auditra verify --json

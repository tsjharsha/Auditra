[project]
name = "auditra"
version = "0.1.0"
description = "Zero-Trust Verification Fabric for AI-Generated Software."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "mcp>=2.2.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
exclude = ["backend/target_service"]

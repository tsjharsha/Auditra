[project]
name = "auditra"
version = "0.1.0"
description = "Autonomous financial control you can verify."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

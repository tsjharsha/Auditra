<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Auditra submission flow</title>
  <desc id="desc">Synthetic payment records flow through deterministic reconciliation, bounded investigation, hidden truth evaluation, and assurance.</desc>
  <rect width="1200" height="360" fill="#171618"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; }
    .heading { fill:#fffdf7; font-size:19px; font-weight:700; }
    .copy { fill:#b9b5af; font-size:14px; }
    .tag { fill:#c7ff54; font-size:12px; font-weight:700; letter-spacing:1.2px; }
    .arrow { stroke:#77736e; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#77736e"/></marker></defs>
  <text x="56" y="52" class="tag">AUDITRA / SUBMISSION FLOW</text>
  <text x="56" y="84" class="heading" style="font-size:28px">Close the batch. Surface the risk. Prove the decision.</text>

  <line x1="265" y1="196" x2="330" y2="196" class="arrow"/>
  <line x1="535" y1="196" x2="600" y2="196" class="arrow"/>
  <line x1="805" y1="196" x2="870" y2="196" class="arrow"/>

  <rect x="56" y="135" width="210" height="125" rx="8" fill="#201f21" stroke="#f7c74d" stroke-opacity=".65"/>
  <text x="80" y="168" class="tag" fill="#f7c74d">INPUT</text>
  <text x="80" y="201" class="heading">Payment batch</text>
  <text x="80" y="228" class="copy">Payments, fees, refunds,</text>
  <text x="80" y="248" class="copy">settlements, 50+ records</text>

  <rect x="326" y="135" width="210" height="125" rx="8" fill="#201f21" stroke="#c7ff54" stroke-opacity=".75"/>
  <text x="350" y="168" class="tag">CONTROL</text>
  <text x="350" y="201" class="heading">Reconcile</text>
  <text x="350" y="228" class="copy">Decimal math, invariants,</text>
  <text x="350" y="248" class="copy">bounded investigation</text>

  <rect x="596" y="135" width="210" height="125" rx="8" fill="#201f21" stroke="#70f0bf" stroke-opacity=".7"/>
  <text x="620" y="168" class="tag" fill="#70f0bf">MEASURE</text>
  <text x="620" y="201" class="heading">Evaluate</text>
  <text x="620" y="228" class="copy">Hidden truth, exact status</text>
  <text x="620" y="248" class="copy">accuracy, honest misses</text>

  <rect x="866" y="135" width="278" height="125" rx="8" fill="#201f21" stroke="#ff6b4a" stroke-opacity=".72"/>
  <text x="890" y="168" class="tag" fill="#ffb08d">ACT</text>
  <text x="890" y="201" class="heading">Assure and review</text>
  <text x="890" y="228" class="copy">Exception list, human review,</text>
  <text x="890" y="248" class="copy">targeted adversarial retest</text>

  <text x="56" y="314" class="copy">AI investigates ambiguous cases. Deterministic controls decide whether financial evidence is safe to close.</text>
</svg>
